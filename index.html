<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <!-- Primary Meta Tags -->
  <title>ENT Pulse • Electronics Class Routine (ENT 4/2)</title>
  <meta name="title" content="ENT Pulse • Electronics Class Routine (ENT 4/2)">
  <meta name="description" content="Official Material Design 3 Academic Routine for Electronics Technology (ENT 4/2), Chapainawabganj Govt. Polytechnic Institute (CNPI). Live class status, countdown timer, day & week views, faculty contacts, and offline PWA.">
  <meta name="application-name" content="ENT Pulse">
  <meta name="apple-mobile-web-app-title" content="ENT Pulse">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#091311" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4faf6" media="(prefers-color-scheme: light)">
  <meta name="format-detection" content="telephone=no">

  <!-- Icons & Manifest -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="alternate" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Design Tokens & Component Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components/nav.css">
  <link rel="stylesheet" href="css/components/hero.css">
  <link rel="stylesheet" href="css/components/notices.css">
  <link rel="stylesheet" href="css/components/views.css">
  <link rel="stylesheet" href="css/components/search.css">
  <link rel="stylesheet" href="css/components/modals.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body data-theme="dark">
  <!-- Accessibility Skip Link -->
  <a href="#routine" class="skip-link">Skip to schedule content</a>

  <!-- Topbar Navigation -->
  <div id="headerMount"></div>

  <!-- Main Content Container -->
  <main id="mainContent" class="app-container">
    <!-- Notice / Announcement Banner -->
    <div id="noticeMount"></div>

    <!-- Section: Today / Live Schedule Hero -->
    <section id="today" aria-label="Today's Live Schedule">
      <div id="heroMount"></div>
    </section>

    <!-- Section: Routine Schedule Matrix & Agenda -->
    <section id="routine" aria-label="Weekly Routine Schedule">
      <div id="searchMount"></div>
      <div id="routineMount"></div>
    </section>

    <!-- Section: Faculty Directory -->
    <section id="faculty" aria-label="Faculty Directory">
      <div id="facultyMount"></div>
    </section>

    <!-- App Footer -->
    <footer class="footer" id="more" role="contentinfo">
      <div class="footer-inner">
        <div class="footer-title"><strong>ENT Pulse</strong> • CNPI • ENT 4/2 • 4th Semester (2026–27)</div>
        <p class="footer-desc">Chapainawabganj Govt. Polytechnic Institute • Electronics Technology Department (Second Shift)</p>
        <div class="footer-credit" id="footerCredit">
          Developed & maintained by <a href="https://mhmahim.me" target="_blank" rel="noopener noreferrer">M. H. Mahim</a> • Class Representative
        </div>
        <div class="footer-links" aria-label="External links">
          <a class="footer-link-pill" href="https://mhmahim.me" target="_blank" rel="noopener noreferrer">Portfolio</a>
          <a class="footer-link-pill" href="https://github.com/mh-mahim/ECR" target="_blank" rel="noopener noreferrer">GitHub Repo</a>
          <a class="footer-link-pill" href="https://facebook.com/m.h.mahim.facebook" target="_blank" rel="noopener noreferrer">Facebook</a>
          <button class="footer-link-pill" onclick="window.generateIcsCalendar()" aria-label="Download calendar">📅 Export .ics</button>
          <button class="footer-link-pill" onclick="window.print()" aria-label="Print timetable">🖨️ Print Sheet</button>
        </div>
      </div>
    </footer>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <div id="bottomNavMount"></div>

  <!-- Dynamic Modal Overlay & Toast Notifications -->
  <div id="modalMount"></div>
  <div id="toastMount"></div>

  <!-- Application Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
