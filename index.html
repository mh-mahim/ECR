    <style>
        /* =========================================
           SEESUN THEME VARIABLES (BORDERS & WHITE SHADOW)
           ========================================= */
        :root {
            /* Light mode background slightly adjusted so white shadow is visible */
            --bg: #F4EFEB; 
            --fg: #2D231F; 
            --card: #FFFFFF; 
            --primary: #468432; 
            --primary-fg: #FFFFFF;
            --primary-muted: rgba(255, 92, 0, 0.12);
            --secondary: #FFEADB; 
            --secondary-fg: #D64D00;
            --muted: #EBE4DD;
            --muted-fg: #6B5E57;
            /* 🟢 Gaaaro (Darker) Border for Light Mode 🟢 */
            --border: #D0C4BB; 
            
            --today-border: #FF5C00;
            --hover-cell-bg: rgba(255, 92, 0, 0.05);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            
            /* 🟢 White Background Shadow for Light Mode 🟢 */
            --shadow-soft: -6px 10px 25px rgba(255, 255, 255, 1), 6px 10px 20px rgba(0, 0, 0, 0.04);
            --shadow-glow: 0 8px 25px rgba(255, 255, 255, 0.9), 0 0 15px rgba(255, 92, 0, 0.2);
            
            font-family: 'Inter', sans-serif;
        }

        /* 🟢 HIGH CONTRAST DARK MODE 🟢 */
        [data-theme="dark"] {
            --bg: #0C0A09; 
            --fg: #FFFFFF; 
            --card: #1A1513; 
            /* 🟢 Halka Orange for better text visibility 🟢 */
            --primary: #FFA366; 
            --primary-fg: #1A1513;
            --primary-muted: rgba(255, 163, 102, 0.15); 
            --secondary: #3D2314; 
            --secondary-fg: #FFD1B3;
            --muted: #2A221E; 
            --muted-fg: #E0C9BB; 
            /* 🟢 Gaaaro (Darker/More Visible) Border for Dark Mode 🟢 */
            --border: #664F42; 
            
            --today-border: #FFA366;
            --hover-cell-bg: rgba(255, 163, 102, 0.15);

            --shadow-soft: 0 12px 30px -10px rgba(0,0,0,0.8);
            --shadow-glow: 0 8px 25px -5px rgba(255, 163, 102, 0.35);
        }

        /* =========================================
           GLOBAL STYLES
           ========================================= */
        body {
            background-color: var(--bg);
            color: var(--fg);
            margin: 0; padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .container { max-width: 1100px; margin: 15px auto; padding: 0 16px; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { box-shadow: inset 0 0 0px var(--today-border); } 50% { box-shadow: inset 0 0 8px var(--today-border); } 100% { box-shadow: inset 0 0 0px var(--today-border); } }
        
        .animate { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        /* ========= HEADER ========= */
        .header {
            background: var(--card); padding: 20px 24px; border-radius: var(--radius-xl);
            box-shadow: var(--shadow-soft); 
            border: 1.5px solid var(--border); /* Slightly thicker global borders */
            display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; position: relative; z-index: 50;
        }

        .title-area { width: 100%; text-align: center; }
        .title-area h1 { margin: 0; font-size: clamp(1.2rem, 5vw, 1.6rem); color: var(--primary); font-weight: 900; letter-spacing: -0.5px; }
        .title-area p { margin: 4px 0 0 0; font-size: 0.9rem; color: var(--muted-fg); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;}

        .header-bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-top: 16px; border-top: 1.5px dashed var(--border); }
        .live-clock { font-size: 0.85rem; font-weight: 700; color: var(--primary); background: var(--primary-muted); padding: 10px 16px; border-radius: var(--radius-md); display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; border: 1.5px solid var(--primary-muted); }
        
        .action-btns { display: flex !important; flex-direction: row !important; gap: 10px !important; align-items: center; flex-wrap: nowrap !important; }
        .btn-icon { background: var(--muted); color: var(--fg); border: 1.5px solid var(--border); width: 44px !important; height: 44px !important; border-radius: var(--radius-md) !important; cursor: pointer; transition: 0.2s; display: flex !important; align-items: center !important; justify-content: center !important; flex-shrink: 0 !important; }
        .btn-icon:hover { transform: scale(1.05); background: var(--primary); color: var(--primary-fg); box-shadow: var(--shadow-glow); border-color: var(--primary); }

        /* ========= TABLE ========= */
        .table-wrapper { background: var(--card); border-radius: var(--radius-xl); box-shadow: var(--shadow-soft); border: 1.5px solid var(--border); overflow-x: auto; margin-bottom: 25px; scroll-behavior: smooth; position: relative; z-index: 10; padding: 4px; }
        .table-wrapper::-webkit-scrollbar { height: 8px; }
        .table-wrapper::-webkit-scrollbar-track { background: transparent; }
        .table-wrapper::-webkit-scrollbar-thumb { background: rgba(255, 92, 0, 0.3); border-radius: var(--radius-md); }

        table { width: 100%; min-width: 950px; border-collapse: separate; border-spacing: 4px; text-align: center; }
        
        /* 🟢 THICKER 2px Borders inside Routine Table 🟢 */
        th, td { padding: 12px 8px; border-radius: var(--radius-md); transition: 0.2s; border: 2px solid var(--border); }
        
        th { background: var(--muted); color: var(--muted-fg); font-weight: 800; padding: 16px 8px; font-size: 0.95rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        th:hover { background: var(--primary-muted); color: var(--primary); border-color: var(--primary-muted);} 
        
        .time-header { background: var(--primary) !important; color: var(--primary-fg) !important; cursor: default; border-color: var(--primary) !important;}
        .time-header:hover { transform: none; }
        .time-col { background: var(--muted); color: var(--fg); white-space: normal; line-height: 1.3; }
        
        .filled-cell { cursor: pointer; background: var(--card); border-color: var(--border);}
        .filled-cell:hover { background: var(--hover-cell-bg); border-color: var(--primary-muted); box-shadow: var(--shadow-soft);}
        .empty-cell { background: transparent; color: var(--muted-fg); font-weight: 600; font-size: 1.1rem; pointer-events: none; opacity: 0.4; border: 2px dashed var(--border);}

        .highlight-col-bg { background-color: var(--primary-muted) !important; border-color: var(--primary-muted) !important;}
        th.highlight-today { background: var(--primary) !important; color: var(--primary-fg) !important; box-shadow: var(--shadow-glow); border-color: var(--primary) !important; animation: pulseGlow 2.5s infinite alternate; }

        .sub-name { font-weight: 800; color: var(--primary); font-size: 0.85rem; line-height: 1.3; margin-bottom: 6px; display: block;}
        
        .room-no { font-size: 0.7rem; background: var(--primary-muted); color: var(--primary); border: 1.5px solid currentColor; padding: 4px 10px; border-radius: var(--radius-md); font-weight: 800; display: inline-block; margin-top: 4px; }

        .today-btn-wrapper { text-align: center; margin-bottom: 40px; }
        .btn-large { background: var(--primary); color: var(--primary-fg); border: none; padding: 16px 32px; border-radius: var(--radius-md); font-weight: 800; cursor: pointer; font-size: 1.1rem; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; box-shadow: var(--shadow-glow); }
        .btn-large:hover { transform: translateY(-4px); }

        /* ========= TEACHER GRID ========= */
        .section-title { text-align: center; color: var(--fg); font-size: 1.3rem; font-weight: 800; margin-bottom: 24px; letter-spacing: -0.5px;}
        .section-title span { color: var(--primary); }
        
        .teacher-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 40px; }
        .card { background: var(--card); padding: 20px; border-radius: var(--radius-lg); border: 1.5px solid var(--border); box-shadow: var(--shadow-soft); cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-4px); border-color: var(--primary-muted); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        body.dark .card:hover { box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .card h3 { margin: 0 0 6px 0; color: var(--fg); font-size: 1.1rem; font-weight: 800; padding-right: 40px; }
        .card .desig { font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; color: var(--primary); }
        .card .details { font-size: 0.8rem; font-weight: 600; color: var(--muted-fg); display: flex; align-items: center; gap: 6px; }

        /* ========= FIXED PERFECT MODAL ========= */
        .modal {
            position: fixed; inset: 0; 
            background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center;
            z-index: 2000; backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.3s ease; padding: 16px;
        }
        .modal.show { opacity: 1; }
        
        .modal-content {
            background: var(--bg); padding: 24px; border-radius: var(--radius-xl); border: 1.5px solid var(--border);
            max-width: 420px; width: 100%; position: relative; text-align: center;
            box-shadow: 0 24px 50px rgba(0,0,0,0.4); transform: translateY(30px); transition: transform 0.3s ease;
            max-height: 85vh; overflow-y: auto; margin: auto; 
        }
        .modal-content::-webkit-scrollbar { width: 4px; }
        .modal-content::-webkit-scrollbar-thumb { background: rgba(255, 92, 0, 0.3); border-radius: var(--radius-md); }
        .modal.show .modal-content { transform: translateY(0); }
        
        .modal-close { position: absolute; top: 16px; right: 16px; cursor: pointer; color: var(--muted-fg); background: var(--muted); border-radius: var(--radius-sm); padding: 6px; transition: 0.2s; z-index: 10; border: none; display: flex; align-items: center; justify-content: center;}
        .modal-close:hover { background: var(--destructive-muted); color: var(--destructive); transform: rotate(90deg); }

        .modal-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 24px; }
        .m-btn { padding: 14px 16px; border-radius: var(--radius-md); border: none; font-weight: 800; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; flex: 1; min-width: 100px; justify-content: center; }
        .btn-call { background: var(--primary); color: var(--primary-fg); box-shadow: var(--shadow-glow);}
        .btn-call:active { transform: scale(0.95); }
        .btn-save { background: var(--primary-muted); color: var(--primary); border: 1.5px solid var(--primary-muted); }
        .btn-share { background: var(--card); color: var(--fg); border: 1.5px solid var(--border); }

        .teacher-link { color: var(--primary); text-decoration: underline; cursor: pointer; font-weight: 800; transition: 0.2s; }
        .teacher-link:hover { opacity: 0.7; }

        .classes-list-container { max-height: 60vh; overflow-y: auto; background: var(--muted); border-radius: var(--radius-lg); padding: 8px; border: 1.5px solid var(--border); }
        .classes-list-container::-webkit-scrollbar { width: 4px; }
        .classes-list-container::-webkit-scrollbar-thumb { background: rgba(255, 92, 0, 0.3); border-radius: var(--radius-md); }

        .day-class-item { text-align: left; padding: 16px; border: 1.5px solid var(--border); display: flex; gap: 16px; align-items: center; cursor: pointer; transition: 0.2s; border-radius: var(--radius-md); margin-bottom: 8px; background: var(--card); box-shadow: var(--shadow-soft); }
        .day-class-item:hover { border-color: var(--primary-muted); transform: translateY(-2px); }
        .day-class-item:last-child { margin-bottom: 0; }

        .toast-notification { visibility: hidden; min-width: 250px; background-color: var(--fg); color: var(--bg); text-align: center; border-radius: var(--radius-md); padding: 16px 24px; position: fixed; z-index: 3000; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px); opacity: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 14px; box-shadow: var(--shadow-glow); transition: 0.3s ease; }
        .toast-notification.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }

        footer { padding: 40px 0; border-top: 1.5px dashed var(--border); text-align: center; margin-top: 20px; }
        .social-icons { display: flex; justify-content: center; gap: 16px; margin: 20px 0; }
        .s-icon { width: 48px; height: 48px; background: var(--muted); color: var(--fg); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s; border: 1.5px solid var(--border);}
        .s-icon:hover { background: var(--primary); color: var(--primary-fg); box-shadow: var(--shadow-glow); border-color: var(--primary); transform: translateY(-4px);}
    </style>

        function init() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            const teacherCont = document.getElementById('teacher-container');

            days.forEach(day => {
                const th = document.createElement('th');
                th.id = `th-${day}`; th.textContent = day;
                th.onclick = () => showClassesByDay(day);
                th.title = `Click to view ${day}'s classes`;
                head.appendChild(th);
            });

            const skipMap = {};

            periods.forEach(p => {
                const tr = document.createElement('tr');
                const timeParts = p.time.split(' - ');
                tr.innerHTML = `<td class="time-col">
                    <div style="font-size:0.9rem; color:var(--primary); font-weight:800; margin-bottom:4px;">${p.name}</div>
                    <div style="font-size:0.85rem; font-weight:700;">${timeParts[0]}</div>
                    <div style="font-size:0.7rem; color:var(--muted-fg); margin:2px 0; font-weight:600;">to</div>
                    <div style="font-size:0.85rem; font-weight:700;">${timeParts[1]}</div>
                </td>`;
                
                days.forEach(day => {
                    const key = `${day}-${p.id}`;
                    if (skipMap[key]) return;

                    const classInfo = routineData.find(r => r.day === day && r.period === p.id);
                    const td = document.createElement('td');
                    td.id = `cell-${day}-${p.id}`;
                    
                    if (classInfo) {
                        let span = 1;
                        for (let nextId = p.id + 1; nextId <= periods.length; nextId++) {
                            const nextClass = routineData.find(r => r.day === day && r.period === nextId);
                            if (nextClass && nextClass.sub === classInfo.sub && nextClass.code === classInfo.code) {
                                span++; skipMap[`${day}-${nextId}`] = true;
                            } else break;
                        }

                        if (span > 1) td.rowSpan = span;
                        td.className = "filled-cell";
                        td.innerHTML = `<div style="padding:4px;"><span class="sub-name">${classInfo.sub}</span><span style="font-size:0.75rem; font-weight:700; color:var(--muted-fg);">${classInfo.code}</span><br><span class="room-no">${classInfo.room}</span></div>`;
                        td.onclick = () => showClassModal(classInfo, p.time);
                    } else {
                        td.className = "empty-cell"; td.textContent = "-";
                    }
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });

            teacherData.forEach(t => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div style="position:absolute; top:20px; right:20px; background:var(--muted); color:var(--primary); width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; border: 1.5px solid var(--border);"><span class="material-icons-round" style="font-size:18px;">open_in_new</span></div>
                                  <h3>${t.name}</h3>
                                  <div class="desig">${t.sub}</div>
                                  <div class="details"><span class="material-icons-round" style="font-size:16px;">phone_iphone</span> ${t.phone}</div>`;
                card.onclick = () => showTeacherModal(t);
                teacherCont.appendChild(card);
            });

            updateLiveClock();
            updateHighlights();
            setTimeout(triggerFullScroll, 1200);
        }

        function triggerFullScroll() {
            const wrapper = document.getElementById('table-scroll');
            const max = wrapper.scrollWidth - wrapper.clientWidth;
            if (max > 0) {
                wrapper.scrollTo({ left: max, behavior: 'smooth' });
                setTimeout(() => wrapper.scrollTo({ left: 0, behavior: 'smooth' }), 1200);
            }
        }

        function updateLiveClock() {
            const now = new Date();
            document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
            document.getElementById('time-display').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        }
        setInterval(updateLiveClock, 1000);

        function updateHighlights() {
            const today = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][new Date().getDay()];
            document.querySelectorAll('th, td').forEach(el => el.classList.remove('highlight-col-bg', 'highlight-today'));
            if (days.includes(today)) {
                const th = document.getElementById(`th-${today}`);
                if (th) th.classList.add('highlight-today');
                document.querySelectorAll(`[id^="cell-${today}"]`).forEach(td => td.classList.add('highlight-col-bg'));
            }
        }

        function openModal() {
            const m = document.getElementById('global-modal'); 
            m.style.display = 'flex';
            setTimeout(() => m.classList.add('show'), 10);
        }

        function closeModal() {
            const m = document.getElementById('global-modal'); 
            m.classList.remove('show');
            setTimeout(() => m.style.display = 'none', 300);
        }

        function openClassDetailsFromDay(day, periodId, timeStr) {
            const classInfo = routineData.find(r => r.day === day && r.period === periodId);
            if(classInfo) {
                const modalContent = document.querySelector('.modal-content');
                modalContent.style.transform = 'scale(0.95)';
                modalContent.style.opacity = '0';
                setTimeout(() => {
                    showClassModal(classInfo, timeStr);
                    modalContent.style.transform = 'translateY(0)';
                    modalContent.style.opacity = '1';
                }, 200);
            }
        }

        function showClassModal(info, time) {
            const t = teacherData.find(x => x.code === info.code);
            document.getElementById('modal-body').innerHTML = `
                <div style="width:50px; height:6px; background:var(--muted); border-radius:10px; margin:0 auto 20px;"></div>
                <h2 style="color:var(--primary); margin:0 0 12px 0; font-size:1.6rem; font-weight:800;">Class Details</h2>
                <div style="font-size:1.3rem; font-weight:800; color:var(--fg); margin-bottom:20px;">${info.sub}</div>
                <div style="background:var(--muted); padding:20px; border-radius:var(--radius-lg); text-align:left; margin-bottom:20px; color:var(--fg); border: 1.5px solid var(--border);">
                    <div style="font-weight: 600;"><span class="material-icons-round" style="vertical-align:middle; font-size:20px; color:var(--primary); margin-right: 6px;">person</span> <b>Teacher:</b> <span class="teacher-link" onclick="showTeacherModalByCode('${info.code}')">${t ? t.name : info.code}</span></div>
                    <div style="margin-top:12px; font-weight: 600;"><span class="material-icons-round" style="vertical-align:middle; font-size:20px; color:var(--primary); margin-right: 6px;">room</span> <b>Room:</b> <span class="room-no" style="margin:0">${info.room}</span></div>
                </div>
                <div style="background:var(--primary-muted); color:var(--primary); padding:16px; border-radius:var(--radius-md); font-weight:800; font-size: 1rem; border: 1.5px solid var(--primary-muted);">
                    <span class="material-icons-round" style="vertical-align:middle;">event</span> ${info.day} &bull; ${time}
                </div>`;
            openModal();
        }

        function showTeacherModalByCode(code) {
            const t = teacherData.find(x => x.code === code);
            if (t) {
                const modalContent = document.querySelector('.modal-content');
                modalContent.style.transform = 'scale(0.95)';
                modalContent.style.opacity = '0';
                setTimeout(() => {
                    showTeacherModal(t);
                    modalContent.style.transform = 'translateY(0)';
                    modalContent.style.opacity = '1';
                }, 200);
            }
        }

        function showTeacherModal(t) {
            document.getElementById('modal-body').innerHTML = `
                <div style="width:50px; height:6px; background:var(--muted); border-radius:10px; margin:0 auto 16px;"></div>
                <h2 style="color:var(--primary); margin:0; font-weight: 900;">Teacher Profile</h2>
                <div style="font-size:1.4rem; font-weight:800; margin-top:12px; color:var(--fg);">${t.name}</div>
                <div style="font-weight:700; color:var(--primary); margin-top: 4px;">${t.sub}</div>
                <div style="font-size:0.85rem; font-weight:600; color:var(--muted-fg); margin-bottom:24px; margin-top: 6px;">${t.desig}</div>
                
                <div style="position:relative; display:flex; align-items:center; justify-content:center; background:var(--primary-muted); padding:16px 20px; border-radius:var(--radius-md); border:1.5px solid var(--primary-muted);">
                    <div style="display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.25rem; color:var(--primary);">
                        <span class="material-icons-round">phone</span> ${t.phone}
                    </div>
                    <div onclick="copyPhone('${t.phone}')" style="position:absolute; right:16px; background:var(--primary); color:#fff; padding:8px; border-radius:12px; cursor:pointer; display:flex; transition:0.2s; box-shadow: var(--shadow-glow);" title="Copy">
                        <span class="material-icons-round" style="font-size:18px;">content_copy</span>
                    </div>
                </div>

                <div class="modal-btns">
                    <button class="m-btn btn-call" onclick="window.location.href='tel:${t.phone}'"><span class="material-icons-round">call</span> Call</button>
                    <button class="m-btn btn-save" onclick="saveVCard('${t.name}', '${t.phone}')"><span class="material-icons-round">person_add</span> Save</button>
                    <button class="m-btn btn-share" onclick="shareTeacher('${t.name}', '${t.phone}')"><span class="material-icons-round">share</span> Share</button>
                </div>`;
            openModal();
        }

        function showClassesByDay(dayReq) {
            let targetDay = dayReq;
            let displayTitle = dayReq;

            if (dayReq === 'Today') {
                targetDay = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][new Date().getDay()];
                displayTitle = `Today's Classes <br><span style="font-size:1.1rem; color:var(--muted-fg); font-weight:700;">(${targetDay})</span>`;
            } else {
                displayTitle = `${targetDay}'s Classes`;
            }

            const classes = routineData.filter(r => r.day === targetDay);
            let html = "";
            
            if (classes.length > 0) {
                const uniqueClasses = [];
                let skipNext = 0;
                
                classes.forEach((c, index) => {
                    if (skipNext > 0) { skipNext--; return; }
                    
                    let span = 1;
                    for (let i = index + 1; i < classes.length; i++) {
                        if (classes[i].sub === c.sub && classes[i].code === c.code) span++; else break;
                    }
                    skipNext = span - 1;

                    const startP = periods.find(x => x.id === c.period);
                    const endP = periods.find(x => x.id === (c.period + span - 1));
                    
                    let timeStr = span > 1 ? `${startP.time.split(' - ')[0]} - ${endP.time.split(' - ')[1]}` : startP.time;
                    let periodStr = span > 1 ? `${startP.name} to ${endP.name}` : startP.name;

                    html += `<div class="day-class-item" onclick="openClassDetailsFromDay('${targetDay}', ${c.period}, '${timeStr}')">
                        <div style="background:var(--primary-muted); color:var(--primary); padding:10px; border-radius:12px; font-weight:800; min-width:90px; text-align:center; font-size:0.8rem; border: 1.5px solid var(--primary-muted);">
                            ${periodStr}<br><span style="font-size:0.65rem; color:var(--fg); margin-top:4px; display:block;">${timeStr}</span>
                        </div>
                        <div style="flex:1;">
                            <div style="font-weight:800; color:var(--fg); font-size:1rem;">${c.sub}</div>
                            <div style="font-size:0.85rem; font-weight:600; color:var(--muted-fg); margin-top:4px;">${c.code} &bull; ${c.room}</div>
                        </div>
                        <div style="color: var(--primary); opacity: 0.8; background: var(--muted); padding: 4px; border-radius: 50%;">
                            <span class="material-icons-round">chevron_right</span>
                        </div>
                    </div>`;
                });
            } else html = `<div style='padding:40px 20px; text-align:center;'><span class="material-icons-round" style="font-size:60px; color:var(--muted-fg); margin-bottom: 16px;">celebration</span><h3 style="color:var(--primary); margin:0; font-weight:900; font-size:1.5rem;">No classes!</h3><p style="font-size:1rem; color:var(--muted-fg); font-weight: 600; margin-top:8px;">Enjoy your day off.</p></div>`;

            document.getElementById('modal-body').innerHTML = `
                <div style="width:50px; height:6px; background:var(--muted); border-radius:10px; margin:0 auto 20px;"></div>
                <h2 style="color:var(--primary); margin:0 0 20px 0; font-weight: 900; line-height: 1.3;">${displayTitle}</h2>
                <div class="classes-list-container">${html}</div>`;
            openModal();
        }

        function showToast(msg, icon = 'check_circle') {
            const t = document.getElementById("toast"); 
            document.getElementById("toast-message").textContent = msg;
            document.getElementById("toast-icon").textContent = icon;
            t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 3000);
        }

        function copyPhone(num) { navigator.clipboard.writeText(num).then(() => showToast("Number Copied!")); }

        function shareTeacher(name, num) {
            const txt = `Teacher: ${name}\nPhone: ${num}`;
            if (navigator.share) navigator.share({ title: 'Contact', text: txt }); else copyPhone(txt);
        }

        function saveVCard(name, phone) {
            const v = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nTEL:${phone}\nEND:VCARD`;
            const blob = new Blob([v], { type: "text/vcard" });
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
            a.download = `${name.replace(/\s/g, '_')}.vcf`; a.click();
            showToast("VCard Downloaded!");
        }

        function toggleTheme() {
            const b = document.body; b.setAttribute("data-theme", b.getAttribute("data-theme") === "dark" ? "" : "dark");
        }

        function toggleView() {
            const vp = document.getElementById("viewport-meta");
            const icon = document.getElementById("view-icon");
            if (vp.content === "width=1024") {
                vp.content = "width=device-width, initial-scale=1.0";
                icon.textContent = "desktop_windows";
            } else {
                vp.content = "width=1024";
                icon.textContent = "phone_iphone";
            }
        }

        init();
    </script>
</body>
</html>
