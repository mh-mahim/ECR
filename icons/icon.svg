<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="70" y1="30" x2="440" y2="480" gradientUnits="userSpaceOnUse">
    <stop stop-color="#173c33"/>
    <stop offset=".48" stop-color="#0b241e"/>
    <stop offset="1" stop-color="#06110e"/>
  </linearGradient>
  <linearGradient id="edge" x1="80" y1="60" x2="430" y2="450" gradientUnits="userSpaceOnUse">
    <stop stop-color="#b6ffe8"/>
    <stop offset=".32" stop-color="#55e5bc"/>
    <stop offset=".72" stop-color="#14a982"/>
    <stop offset="1" stop-color="#075443"/>
  </linearGradient>
  <linearGradient id="chip" x1="150" y1="115" x2="375" y2="400" gradientUnits="userSpaceOnUse">
    <stop stop-color="#1d4b3e"/>
    <stop offset=".52" stop-color="#0c2b23"/>
    <stop offset="1" stop-color="#061711"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
  </filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<!-- premium dark base -->
<rect x="18" y="18" width="476" height="476" rx="118" fill="url(#bg)" stroke="#081713" stroke-width="8"/>
<rect x="38" y="38" width="436" height="436" rx="104" fill="none" stroke="rgba(152,255,224,.16)" stroke-width="2"/>
<!-- floating 3D chip -->
<g filter="url(#shadow)">
  <rect x="112" y="96" width="288" height="320" rx="58" fill="url(#edge)"/>
  <rect x="128" y="112" width="256" height="288" rx="48" fill="url(#chip)" stroke="#75f1cb" stroke-opacity=".35" stroke-width="3"/>
</g>
<!-- chip pins -->
<g stroke="#67e9c2" stroke-width="7" stroke-linecap="round" opacity=".72">
  <path d="M92 160h25M92 206h25M92 252h25M92 298h25M92 344h25"/>
  <path d="M395 160h25M395 206h25M395 252h25M395 298h25M395 344h25"/>
  <path d="M174 76v26M220 76v26M266 76v26M312 76v26M358 76v26"/>
  <path d="M174 410v26M220 410v26M266 410v26M312 410v26M358 410v26"/>
</g>
<!-- subtle PCB traces -->
<g fill="none" stroke="#4be1b5" stroke-opacity=".22" stroke-width="3">
  <path d="M145 150h38v20h25"/><path d="M367 150h-38v20h-25"/>
  <path d="M145 354h38v-20h25"/><path d="M367 354h-38v-20h-25"/>
</g>
<!-- pulse line -->
<g filter="url(#glow)">
  <path d="M158 258h43l22-52 35 106 31-78 22 24h43" fill="none" stroke="#9bffe2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="158" cy="258" r="8" fill="#b9ffeb"/><circle cx="354" cy="258" r="8" fill="#b9ffeb"/>
</g>
<!-- app initials -->
<text x="256" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="800" letter-spacing="7" fill="#e8fff8">EP</text>
<text x="256" y="389" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#6fb9a7">ENT PULSE</text>
</svg>
